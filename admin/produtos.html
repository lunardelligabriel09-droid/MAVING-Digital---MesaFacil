<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MesaFácil — Produtos</title>
  <link rel="stylesheet" href="/app/shared/css/base.css" />
  <link rel="stylesheet" href="/app/admin/css/admin.css" />
</head>
<body>
  <div class="layout-admin">
    <aside class="barra-lateral">
      <div class="marca-admin">
        <img src="/app/shared/img/logo.svg" alt="" width="34" height="34" />
        <div><strong>MesaFácil</strong><span>Administração</span></div>
      </div>
      <ul class="menu-admin">
        <li><a href="/admin/dashboard">Painel</a></li>
        <li><a href="/admin/produtos">Produtos</a></li>
        <li><a href="/admin/categorias">Categorias</a></li>
        <li><a href="/admin/mesas">Mesas &amp; QR Code</a></li>
        <li><a href="/admin/usuarios">Usuários</a></li>
      </ul>
      <div class="rodape-lateral">
        <span class="nome-usuario" id="nome-usuario-admin">—</span>
        <button id="btn-sair-admin" class="btn btn-secundaria btn-pequeno btn-bloco">Sair</button>
      </div>
    </aside>

    <div class="area-principal">
      <header class="topo-admin">
        <button id="btn-abrir-menu" class="btn-abrir-menu">☰</button>
        <h1>Produtos</h1>
      </header>
      <main class="conteudo-admin">
        <div id="alerta-produtos"></div>
        <div class="barra-acoes">
          <input type="search" id="input-busca-produtos" placeholder="Buscar produto…" />
          <button class="btn btn-primaria" id="btn-novo-produto">+ Novo produto</button>
        </div>
        <div class="tabela-scroll">
          <table class="tabela-admin">
            <thead>
              <tr><th></th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="corpo-tabela-produtos">
              <tr><td colspan="6" class="carregando">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-produto" class="modal-admin oculto">
    <div class="modal-admin-conteudo">
      <button class="modal-admin-fechar" id="btn-fechar-modal-produto">×</button>
      <h2 id="titulo-modal-produto">Novo produto</h2>
      <div id="alerta-modal-produto"></div>
      <form id="form-produto">
        <input type="hidden" id="produto-id" />
        <img id="produto-preview-imagem" class="preview-imagem oculto" alt="Pré-visualização" />
        <div class="campo">
          <label for="produto-arquivo-imagem">Imagem do produto</label>
          <input type="file" id="produto-arquivo-imagem" accept="image/png,image/jpeg,image/webp" />
          <span class="campo-ajuda">PNG, JPG ou WEBP. Opcional.</span>
        </div>
        <div class="campo">
          <label for="produto-nome">Nome</label>
          <input type="text" id="produto-nome" maxlength="120" required />
        </div>
        <div class="linha-form-dupla">
          <div class="campo">
            <label for="produto-categoria">Categoria</label>
            <select id="produto-categoria" required></select>
          </div>
          <div class="campo">
            <label for="produto-preco">Preço (R$)</label>
            <input type="number" id="produto-preco" min="0" step="0.01" required />
          </div>
        </div>
        <div class="campo">
          <label for="produto-descricao">Descrição</label>
          <textarea id="produto-descricao" maxlength="500"></textarea>
        </div>
        <div class="acoes-modal">
          <button type="submit" class="btn btn-primaria">Salvar</button>
          <button type="button" class="btn btn-texto" id="btn-cancelar-produto">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app/shared/js/api.js"></script>
  <script src="/app/admin/js/admin-shell.js"></script>
  <script src="/app/admin/js/produtos.js"></script>
</body>
</html>
