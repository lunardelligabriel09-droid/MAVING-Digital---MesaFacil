<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MesaFácil — Categorias</title>
  <link rel="stylesheet" href="/app/shared/css/base.css" />
  <link rel="stylesheet" href="/app/admin/css/admin.css" />
</head>
<body>
  <div class="layout-admin">
    <aside class="barra-lateral">
      <div class="marca-admin">
        <img src="/app/shared/img/logo.svg" alt="" width="34" height="34" />
        <div><strong>MesaFácil</strong><span>Administração</span></div>
      </div>
      <ul class="menu-admin">
        <li><a href="/admin/dashboard">Painel</a></li>
        <li><a href="/admin/produtos">Produtos</a></li>
        <li><a href="/admin/categorias">Categorias</a></li>
        <li><a href="/admin/mesas">Mesas &amp; QR Code</a></li>
        <li><a href="/admin/usuarios">Usuários</a></li>
      </ul>
      <div class="rodape-lateral">
        <span class="nome-usuario" id="nome-usuario-admin">—</span>
        <button id="btn-sair-admin" class="btn btn-secundaria btn-pequeno btn-bloco">Sair</button>
      </div>
    </aside>

    <div class="area-principal">
      <header class="topo-admin">
        <button id="btn-abrir-menu" class="btn-abrir-menu">☰</button>
        <h1>Categorias</h1>
      </header>
      <main class="conteudo-admin">
        <div id="alerta-categorias"></div>
        <div class="barra-acoes">
          <input type="search" id="input-busca-categorias" placeholder="Buscar categoria…" />
          <button class="btn btn-primaria" id="btn-nova-categoria">+ Nova categoria</button>
        </div>
        <div class="tabela-scroll">
          <table class="tabela-admin">
            <thead>
              <tr><th>Nome</th><th>Descrição</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="corpo-tabela-categorias">
              <tr><td colspan="4" class="carregando">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-categoria" class="modal-admin oculto">
    <div class="modal-admin-conteudo">
      <button class="modal-admin-fechar" id="btn-fechar-modal-categoria">×</button>
      <h2 id="titulo-modal-categoria">Nova categoria</h2>
      <div id="alerta-modal-categoria"></div>
      <form id="form-categoria">
        <input type="hidden" id="categoria-id" />
        <div class="campo">
          <label for="categoria-nome">Nome</label>
          <input type="text" id="categoria-nome" maxlength="80" required />
        </div>
        <div class="campo">
          <label for="categoria-descricao">Descrição</label>
          <textarea id="categoria-descricao" maxlength="255"></textarea>
        </div>
        <div class="acoes-modal">
          <button type="submit" class="btn btn-primaria">Salvar</button>
          <button type="button" class="btn btn-texto" id="btn-cancelar-categoria">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app/shared/js/api.js"></script>
  <script src="/app/admin/js/admin-shell.js"></script>
  <script src="/app/admin/js/categorias.js"></script>
</body>
</html>
