<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MesaFácil — Painel Administrativo</title>
  <link rel="stylesheet" href="/app/shared/css/base.css" />
  <link rel="stylesheet" href="/app/admin/css/admin.css" />
</head>
<body>
  <div class="layout-admin">
    <aside class="barra-lateral">
      <div class="marca-admin">
        <img src="/app/shared/img/logo.svg" alt="" width="34" height="34" />
        <div>
          <strong>MesaFácil</strong>
          <span>Administração</span>
        </div>
      </div>
      <ul class="menu-admin">
        <li><a href="/admin/dashboard">Painel</a></li>
        <li><a href="/admin/produtos">Produtos</a></li>
        <li><a href="/admin/categorias">Categorias</a></li>
        <li><a href="/admin/mesas">Mesas &amp; QR Code</a></li>
        <li><a href="/admin/usuarios">Usuários</a></li>
      </ul>
      <div class="rodape-lateral">
        <span class="nome-usuario" id="nome-usuario-admin">—</span>
        <button id="btn-sair-admin" class="btn btn-secundaria btn-pequeno btn-bloco">Sair</button>
      </div>
    </aside>

    <div class="area-principal">
      <header class="topo-admin">
        <button id="btn-abrir-menu" class="btn-abrir-menu">☰</button>
        <h1>Painel</h1>
      </header>
      <main class="conteudo-admin">
        <div class="grade-indicadores" id="grade-indicadores">
          <div class="indicador"><span>Mesas ativas</span><strong id="ind-mesas">—</strong></div>
          <div class="indicador"><span>Produtos ativos</span><strong id="ind-produtos">—</strong></div>
          <div class="indicador"><span>Comandas abertas</span><strong id="ind-comandas">—</strong></div>
          <div class="indicador"><span>Pedidos em andamento</span><strong id="ind-pedidos">—</strong></div>
        </div>
        <p class="somente-leitura-texto">Bem-vindo(a) à administração do MesaFácil. Use o menu ao lado para gerenciar produtos, categorias, mesas e usuários.</p>
      </main>
    </div>
  </div>

  <script src="/app/shared/js/api.js"></script>
  <script src="/app/admin/js/admin-shell.js"></script>
  <script src="/app/admin/js/dashboard.js"></script>
</body>
</html>
