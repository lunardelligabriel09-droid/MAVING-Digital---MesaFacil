<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MesaFácil — Usuários</title>
  <link rel="stylesheet" href="/app/shared/css/base.css" />
  <link rel="stylesheet" href="/app/admin/css/admin.css" />
</head>
<body>
  <div class="layout-admin">
    <aside class="barra-lateral">
      <div class="marca-admin">
        <img src="/app/shared/img/logo.svg" alt="" width="34" height="34" />
        <div><strong>MesaFácil</strong><span>Administração</span></div>
      </div>
      <ul class="menu-admin">
        <li><a href="/admin/dashboard">Painel</a></li>
        <li><a href="/admin/produtos">Produtos</a></li>
        <li><a href="/admin/categorias">Categorias</a></li>
        <li><a href="/admin/mesas">Mesas &amp; QR Code</a></li>
        <li><a href="/admin/usuarios">Usuários</a></li>
      </ul>
      <div class="rodape-lateral">
        <span class="nome-usuario" id="nome-usuario-admin">—</span>
        <button id="btn-sair-admin" class="btn btn-secundaria btn-pequeno btn-bloco">Sair</button>
      </div>
    </aside>

    <div class="area-principal">
      <header class="topo-admin">
        <button id="btn-abrir-menu" class="btn-abrir-menu">☰</button>
        <h1>Usuários</h1>
      </header>
      <main class="conteudo-admin">
        <div id="alerta-usuarios"></div>
        <div class="barra-acoes">
          <span class="somente-leitura-texto">Contas de acesso à administração, caixa e cozinha.</span>
          <button class="btn btn-primaria" id="btn-novo-usuario">+ Novo usuário</button>
        </div>
        <div class="tabela-scroll">
          <table class="tabela-admin">
            <thead>
              <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="corpo-tabela-usuarios">
              <tr><td colspan="5" class="carregando">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-usuario" class="modal-admin oculto">
    <div class="modal-admin-conteudo">
      <button class="modal-admin-fechar" id="btn-fechar-modal-usuario">×</button>
      <h2 id="titulo-modal-usuario">Novo usuário</h2>
      <div id="alerta-modal-usuario"></div>
      <form id="form-usuario">
        <input type="hidden" id="usuario-id" />
        <div class="campo">
          <label for="usuario-nome">Nome</label>
          <input type="text" id="usuario-nome" maxlength="120" required />
        </div>
        <div class="campo">
          <label for="usuario-email">E-mail</label>
          <input type="email" id="usuario-email" maxlength="150" required />
        </div>
        <div class="linha-form-dupla">
          <div class="campo">
            <label for="usuario-perfil">Perfil</label>
            <select id="usuario-perfil" required>
              <option value="admin">Administrador</option>
              <option value="caixa">Caixa</option>
              <option value="cozinha">Cozinha</option>
            </select>
          </div>
          <div class="campo">
            <label for="usuario-senha">Senha</label>
            <input type="password" id="usuario-senha" minlength="6" placeholder="mín. 6 caracteres" />
            <span class="campo-ajuda" id="ajuda-senha-usuario">Obrigatório para novos usuários.</span>
          </div>
        </div>
        <div class="acoes-modal">
          <button type="submit" class="btn btn-primaria">Salvar</button>
          <button type="button" class="btn btn-texto" id="btn-cancelar-usuario">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app/shared/js/api.js"></script>
  <script src="/app/admin/js/admin-shell.js"></script>
  <script src="/app/admin/js/usuarios.js"></script>
</body>
</html>
